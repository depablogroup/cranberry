name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cranberry-ci
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Install REMD dependencies
        run: conda install -y pip setuptools wheel openmm openmmtools h5py pytest pre-commit build sphinx myst-parser

      - name: Install cranberry package
        run: python -m pip install --no-deps -e ".[dev,remd]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build docs
        run: sphinx-build -b html docs docs/_build/html
