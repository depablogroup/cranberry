name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check publication privacy
        run: bash scripts/check-publication-privacy.sh

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cranberry-ci
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Install REMD dependencies
        run: conda install -y pip setuptools wheel openmm openmmtools openmpi mpi4py h5py pytest pre-commit build sphinx myst-parser

      - name: Install cranberry package
        run: python -m pip install --no-deps -e ".[dev,remd]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Build distributions
        run: python -m build

      - name: Verify packaged publication assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required_suffixes = {
              "cranberry/data/examples/aa/1zih/1zih.pdb",
              "cranberry/data/examples/aa/1zih/README.md",
              "THIRD_PARTY_NOTICES.md",
          }
          missing = {
              suffix
              for suffix in required_suffixes
              if not any(name.endswith(suffix) for name in names)
          }
          if missing:
              raise SystemExit(f"wheel is missing publication assets: {sorted(missing)}")
          PY

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
  
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --redact --verbose /repo
